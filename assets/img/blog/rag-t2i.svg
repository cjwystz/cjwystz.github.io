<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="1" stop-color="#1c2536"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2698ba" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- 标题 -->
  <text x="60" y="85" fill="#ffffff" font-size="44" font-weight="700">RAG 优化文生图</text>
  <text x="60" y="122" fill="#2698ba" font-size="22" font-weight="500">不动模型，修复提示词错位</text>

  <!-- +114% 徽章 -->
  <rect x="600" y="48" width="140" height="52" rx="26" fill="#2698ba"/>
  <text x="670" y="83" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">+114%</text>

  <!-- 流水线：4 个节点 -->
  <g font-size="19" font-weight="600">
    <!-- 节点1 用户提示词 -->
    <rect x="55" y="190" width="150" height="100" rx="12" fill="#222b3d" stroke="#3d4a5e" stroke-width="1.5"/>
    <text x="130" y="232" fill="#c6d0de" text-anchor="middle">用户提示词</text>
    <text x="130" y="260" fill="#5b6b82" font-size="15" font-weight="400">简短 · 缺细节</text>

    <!-- 节点2 检索 -->
    <rect x="245" y="190" width="150" height="100" rx="12" fill="#2698ba" opacity="0.16" stroke="#2698ba" stroke-width="2"/>
    <text x="320" y="232" fill="#7fd4e8" text-anchor="middle">RAG 检索</text>
    <text x="320" y="260" fill="#5b9db0" font-size="15" font-weight="400">Tavily + BGE-m3</text>

    <!-- 节点3 LLM 改写 -->
    <rect x="435" y="190" width="150" height="100" rx="12" fill="#2698ba" opacity="0.16" stroke="#2698ba" stroke-width="2"/>
    <text x="510" y="232" fill="#7fd4e8" text-anchor="middle">LLM 改写</text>
    <text x="510" y="260" fill="#5b9db0" font-size="15" font-weight="400">补齐隐性知识</text>

    <!-- 节点4 T2I -->
    <rect x="625" y="190" width="150" height="100" rx="12" fill="#222b3d" stroke="#3d4a5e" stroke-width="1.5"/>
    <text x="700" y="232" fill="#c6d0de" text-anchor="middle">T2I 生成</text>
    <text x="700" y="260" fill="#5b6b82" font-size="15" font-weight="400">模型零改动</text>

    <!-- 箭头 -->
    <line x1="207" y1="240" x2="241" y2="240" stroke="#2698ba" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="397" y1="240" x2="431" y2="240" stroke="#2698ba" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="587" y1="240" x2="621" y2="240" stroke="#2698ba" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- 底部小图：生成的画 -->
  <g>
    <rect x="55" y="330" width="64" height="64" rx="8" fill="#2a3140" stroke="#3d4a5e"/>
    <circle cx="75" cy="350" r="7" fill="#f5c542"/>
    <path d="M59 386 L75 366 L85 376 L97 360 L115 386 Z" fill="#2698ba"/>
    <rect x="131" y="330" width="64" height="64" rx="8" fill="#2a3140" stroke="#3d4a5e"/>
    <circle cx="151" cy="350" r="7" fill="#f5c542"/>
    <path d="M135 386 L151 366 L161 376 L173 360 L191 386 Z" fill="#2698ba"/>
    <rect x="207" y="330" width="64" height="64" rx="8" fill="#2a3140" stroke="#3d4a5e"/>
    <circle cx="227" cy="350" r="7" fill="#f5c542"/>
    <path d="M211 386 L227 366 L237 376 L249 360 L267 386 Z" fill="#2698ba"/>
    <text x="295" y="370" fill="#5b6b82" font-size="17">消费级硬件可跑 · ollama + ComfyUI</text>
  </g>
</svg>

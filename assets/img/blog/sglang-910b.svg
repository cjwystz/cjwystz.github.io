<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="1" stop-color="#1c2536"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ab7d4"/>
      <stop offset="1" stop-color="#1b86a0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="60" y="90" fill="#ffffff" font-size="46" font-weight="700">SGLang × 昇腾 910B</text>
  <text x="60" y="130" fill="#2698ba" font-size="24" font-weight="500">NPU 推理服务部署实战</text>

  <!-- 服务框 -->
  <rect x="60" y="165" width="300" height="56" rx="10" fill="#2698ba" opacity="0.15" stroke="#2698ba" stroke-width="1.5"/>
  <text x="80" y="200" fill="#7fd4e8" font-size="22" font-weight="600">SGLang Server :30000</text>

  <!-- 连接虚线 -->
  <line x1="210" y1="221" x2="210" y2="268" stroke="#2698ba" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="222" y="250" fill="#5b6b82" font-size="15">ASCEND_RT_VISIBLE_DEVICES=0-3</text>

  <!-- 8 张 NPU -->
  <g>
    <!-- 0-3 可用 -->
    <g>
      <rect x="60"  y="270" width="76" height="76" rx="10" fill="url(#chip)"/>
      <rect x="152" y="270" width="76" height="76" rx="10" fill="url(#chip)"/>
      <rect x="244" y="270" width="76" height="76" rx="10" fill="url(#chip)"/>
      <rect x="336" y="270" width="76" height="76" rx="10" fill="url(#chip)"/>
      <text x="98"  y="315" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="190" y="315" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="282" y="315" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="374" y="315" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="98"  y="340" fill="#d5f4fb" font-size="16" text-anchor="middle">0</text>
      <text x="190" y="340" fill="#d5f4fb" font-size="16" text-anchor="middle">1</text>
      <text x="282" y="340" fill="#d5f4fb" font-size="16" text-anchor="middle">2</text>
      <text x="374" y="340" fill="#d5f4fb" font-size="16" text-anchor="middle">3</text>
    </g>
    <!-- 4-7 占用/未用 -->
    <g opacity="0.45">
      <rect x="428" y="270" width="76" height="76" rx="10" fill="#2a3140" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="520" y="270" width="76" height="76" rx="10" fill="#2a3140" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="612" y="270" width="76" height="76" rx="10" fill="#2a3140" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="704" y="270" width="76" height="76" rx="10" fill="#2a3140" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="466" y="315" fill="#8b98ab" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="558" y="315" fill="#8b98ab" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="650" y="315" fill="#8b98ab" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="742" y="315" fill="#8b98ab" font-size="22" font-weight="700" text-anchor="middle">NPU</text>
      <text x="466" y="340" fill="#8b98ab" font-size="16" text-anchor="middle">4</text>
      <text x="558" y="340" fill="#8b98ab" font-size="16" text-anchor="middle">5</text>
      <text x="650" y="340" fill="#8b98ab" font-size="16" text-anchor="middle">6</text>
      <text x="742" y="340" fill="#8b98ab" font-size="16" text-anchor="middle">7</text>
    </g>
  </g>

  <text x="60" y="395" fill="#5b6b82" font-size="18">Atlas 800I A2 · 8×910B3 · 4 号卡被占用，仅用 0–3</text>
  <text x="60" y="425" fill="#3d4a5e" font-size="15">docker · CANN 9.0.0 · torch_npu · --attention-backend ascend</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="1" stop-color="#1c2536"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- 背景点阵 -->
  <g fill="#2a3140">
    <circle cx="70" cy="40" r="2"/><circle cx="150" cy="70" r="2"/><circle cx="230" cy="35" r="2"/>
    <circle cx="310" cy="60" r="2"/><circle cx="390" cy="30" r="2"/><circle cx="470" cy="65" r="2"/>
    <circle cx="550" cy="40" r="2"/><circle cx="630" cy="70" r="2"/><circle cx="710" cy="35" r="2"/>
    <circle cx="760" cy="110" r="2"/><circle cx="55" cy="120" r="2"/>
    <circle cx="40" cy="330" r="2"/><circle cx="120" cy="380" r="2"/><circle cx="680" cy="360" r="2"/>
    <circle cx="750" cy="320" r="2"/>
  </g>

  <!-- 装饰：网络节点连线（右上） -->
  <g stroke="#2698ba" stroke-width="1.2" opacity="0.5">
    <line x1="560" y1="150" x2="640" y2="120"/>
    <line x1="640" y1="120" x2="710" y2="170"/>
    <line x1="560" y1="150" x2="620" y2="210"/>
    <line x1="620" y1="210" x2="710" y2="170"/>
  </g>
  <g fill="#2698ba" opacity="0.8">
    <circle cx="560" cy="150" r="5"/>
    <circle cx="640" cy="120" r="5"/>
    <circle cx="710" cy="170" r="5"/>
    <circle cx="620" cy="210" r="5"/>
  </g>

  <!-- 标题 -->
  <text x="60" y="215" fill="#ffffff" font-size="52" font-weight="700">大模型系统笔记</text>
  <text x="60" y="262" fill="#2698ba" font-size="24" font-weight="500">Chen Jiawei 的 AI Infra 博客</text>

  <!-- 分隔线 -->
  <line x1="60" y1="295" x2="740" y2="295" stroke="#2a3140" stroke-width="2"/>

  <!-- 三个方向标签 -->
  <g font-size="18" font-weight="600">
    <rect x="60" y="325" width="120" height="44" rx="22" fill="#2698ba" opacity="0.16" stroke="#2698ba" stroke-width="1.5"/>
    <text x="120" y="353" fill="#7fd4e8" text-anchor="middle">分布式训练</text>
    <rect x="200" y="325" width="120" height="44" rx="22" fill="#2698ba" opacity="0.16" stroke="#2698ba" stroke-width="1.5"/>
    <text x="260" y="353" fill="#7fd4e8" text-anchor="middle">推理系统</text>
    <rect x="340" y="325" width="150" height="44" rx="22" fill="#2698ba" opacity="0.16" stroke="#2698ba" stroke-width="1.5"/>
    <text x="415" y="353" fill="#7fd4e8" text-anchor="middle">显存与调度</text>
  </g>

  <text x="60" y="415" fill="#5b6b82" font-size="16">昇腾 910B/C · 沐曦 C550 · 千卡规模</text>
</svg>
